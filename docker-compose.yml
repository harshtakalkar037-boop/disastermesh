services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disastermesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: disastermesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disastermesh"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      DM_DEV: "1"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8787
      DATABASE_URL: postgres://disastermesh:${POSTGRES_PASSWORD}@db:5432/disastermesh
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      SEED_USE_DEV_DEFAULTS: ${SEED_USE_DEV_DEFAULTS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
  command-center:
    build:
      context: .
      dockerfile: command-center/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
